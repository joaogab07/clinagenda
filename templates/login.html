{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<form class="cartao login" method="post">
  <h1>ClinAgenda</h1>
  <p class="sub">Agendamento de consultas</p>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Login <input name="login" required autofocus></label>
  <label>Senha <input name="senha" type="password" required></label>
  <button class="btn">Entrar</button>
  <p class="rodape-form">Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Criar conta</a></p>
</form>
{% endblock %}
