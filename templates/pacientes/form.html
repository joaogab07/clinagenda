{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if id else 'Novo' }} paciente{% endblock %}
{% block conteudo %}
<h1>{{ 'Editar' if id else 'Novo' }} paciente</h1>
<form class="cartao formulario" method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Nome completo* <input name="nome" value="{{ p.nome if p else '' }}" required></label>
  <div class="linha">
    <label>CPF* <input name="cpf" value="{{ formatar_cpf(p.cpf) if p else '' }}" placeholder="000.000.000-00" required></label>
    <label>Data de nascimento* <input type="date" name="data_nascimento" value="{{ p.data_nascimento if p else '' }}" required></label>
  </div>
  <div class="linha">
    <label>Telefone* <input name="telefone" value="{{ p.telefone if p else '' }}" placeholder="(43) 99999-0000" required></label>
    <label>E-mail <input type="email" name="email" value="{{ p.email if p else '' }}"></label>
  </div>
  <label>Endereço <input name="endereco" value="{{ p.endereco if p else '' }}"></label>
  <div class="botoes"><button class="btn">Salvar</button>
    <a class="btn secundario" href="{{ url_for('pacientes') }}">Voltar</a></div>
</form>
{% endblock %}
